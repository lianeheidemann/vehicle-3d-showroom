<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vehicle 3D Showroom</title>
  <meta name="description" content="Showroom 3D interativo: navegue pelo catálogo, gire e aproxime os veículos e consulte suas informações.">
  <meta name="theme-color" content="#0a0b0d">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon/favicon-192.png">
  <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/main.css">

  <!-- A-Frame inclui o Three.js (AFRAME.THREE) e o renderer WebGL: não carregar outro Three.js. -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Showroom 3D — início">
        <img class="brand__mark" src="assets/icon/logo-header.png" alt="" width="151" height="60">
        <span>Showroom <strong>3D</strong></span>
      </a>
      <nav class="topnav" aria-label="Principal">
        <a href="#" class="is-active">Início</a>
        <a href="#catalog">Modelos</a>
      </nav>
      <label class="search" title="Busca disponível em uma próxima versão">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4 4" /></svg>
        <span class="visually-hidden">Buscar veículo</span>
        <input type="search" placeholder="Buscar veículo" disabled>
      </label>
    </header>

    <main class="layout">
      <aside class="panel catalog" id="catalog" aria-labelledby="catalog-title">
        <div class="panel__header">
          <h2 id="catalog-title">Veículos</h2>
          <span class="panel__count" id="catalog-count"></span>
        </div>
        <ul class="vehicle-list" id="vehicle-list">
          <li class="state-message">Carregando veículos…</li>
        </ul>
      </aside>

      <section class="viewer" aria-label="Visualizador 3D do veículo">
        <div class="viewer__stage" id="viewer-stage">
          <a-scene
            id="scene"
            embedded
            background="color: #0d0f12"
            renderer="antialias: true; colorManagement: true; toneMapping: ACESFilmic; exposure: 1.05"
            vr-mode-ui="enabled: false"
            loading-screen="enabled: false"
            keyboard-shortcuts="enterVR: false"
            device-orientation-permission-ui="enabled: false">
            <a-entity light="type: hemisphere; color: #e4ecff; groundColor: #1b1e24; intensity: 1.4"></a-entity>
            <a-entity light="type: directional; color: #ffffff; intensity: 2.2" position="4 7 5"></a-entity>
            <a-entity light="type: directional; color: #9fbfff; intensity: 0.9" position="-6 3 -5"></a-entity>

            <a-entity
              geometry="primitive: cylinder; radius: 3.3; height: 0.04; segmentsRadial: 96"
              material="color: #15181d; roughness: 0.85; metalness: 0.1"
              position="0 -0.021 0"></a-entity>
            <a-entity
              id="platform-ring"
              geometry="primitive: ring; radiusInner: 3.27; radiusOuter: 3.33; segmentsTheta: 128"
              material="color: #3b82f6; shader: flat; transparent: true; opacity: 0.45"
              rotation="-90 0 0"
              position="0 0.001 0"
              animation__pulse="property: material.opacity; from: 1; to: 0.45; dur: 700; easing: easeOutQuad; startEvents: pulse"></a-entity>

            <!-- O modelo do veículo selecionado é inserido aqui por js/viewer.js (um por vez). -->
            <a-entity id="vehicle-root"></a-entity>

            <a-entity id="camera" camera="fov: 40; near: 0.05; far: 200" position="0 1.5 7"></a-entity>
          </a-scene>

          <div class="viewer__overlay" id="viewer-overlay" hidden>
            <span class="spinner" aria-hidden="true"></span>
            <p data-overlay-text></p>
          </div>
          <p class="viewer__notice" id="viewer-notice" hidden>Modelo provisório · GLB final em preparação</p>
        </div>

        <div class="gallery" id="gallery" aria-label="Vistas do veículo"></div>
      </section>

      <aside class="panel info is-empty" id="vehicle-info" aria-live="polite" aria-label="Informações do veículo">
        <p class="info__empty" data-field="empty">Selecione um veículo.</p>
        <div class="info__content">
          <p class="info__brand" data-field="brand"></p>
          <h1 class="info__model" data-field="model"></h1>
          <p class="info__version" data-field="version"></p>

          <dl class="specs" data-field="specs"></dl>

          <div class="actions">
            <button type="button" class="btn btn--primary" data-action="details">Mais detalhes</button>
            <button type="button" class="btn btn--ghost" data-action="contact">Contato</button>
          </div>
        </div>
      </aside>
    </main>

    <footer class="helpbar" aria-label="Como interagir">
      <ul class="helpbar__list">
        <li>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="5" /><path d="M12 7v3" /></svg>
          <span class="only-pointer">Arraste para girar</span><span class="only-touch">Arraste com um dedo para girar</span>
        </li>
        <li>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M8 8l4-4 4 4M8 16l4 4 4-4" /></svg>
          <span class="only-pointer">Scroll para zoom</span><span class="only-touch">Pinça para zoom</span>
        </li>
        <li>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8h10a4 4 0 0 1 4 4v3a2.5 2.5 0 0 1-4.4 1.6L15 15H9l-1.6 1.6A2.5 2.5 0 0 1 3 15v-3a4 4 0 0 1 4-4z" /><path d="M7 11v3M5.5 12.5h3" /></svg>
          Gamepad / InputMapper <span class="helpbar__optional">(opcional)</span>
        </li>
      </ul>
      <span class="gamepad-status" id="gamepad-status" data-state="idle">Nenhum controle conectado</span>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
